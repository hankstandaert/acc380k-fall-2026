name: Refresh Colab links

on:
  push:
    branches:
      - main
    paths:
      - "notebooks/**/*.ipynb"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-colab-links
  cancel-in-progress: false

jobs:
  update-notebook-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current course repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Point every Colab button to its notebook's latest commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          index_path = Path("notebooks/README.md")
          index_text = index_path.read_text()
          url_prefix = (
              "https://colab.research.google.com/github/"
              "njhallman/acc380k-fall-2026/blob/"
          )

          notebook_paths = sorted(Path("notebooks").glob("notebook-*/*.ipynb"))
          if not notebook_paths:
              raise SystemExit("No public notebooks were found.")

          for notebook_path in notebook_paths:
              revision = subprocess.check_output(
                  ["git", "log", "-1", "--format=%H", "--", str(notebook_path)],
                  text=True,
              ).strip()
              if not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise SystemExit(f"No commit was found for {notebook_path}.")

              link_pattern = re.compile(
                  re.escape(url_prefix)
                  + r"[0-9a-f]{40}/"
                  + re.escape(notebook_path.as_posix())
              )
              replacement = f"{url_prefix}{revision}/{notebook_path.as_posix()}"
              index_text, replacement_count = link_pattern.subn(replacement, index_text)
              if replacement_count != 1:
                  raise SystemExit(
                      f"Expected one Colab link for {notebook_path}; "
                      f"found {replacement_count}."
                  )

          index_path.write_text(index_text)
          PY

      - name: Commit an updated notebook index when needed
        shell: bash
        run: |
          if git diff --quiet -- notebooks/README.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/README.md
          git commit -m "Refresh Colab links"
          git push origin main
